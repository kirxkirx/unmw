name: Windows deploy test (via WSL2 Ubuntu)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering from GitHub web interface

permissions:
  contents: read  # Minimal permissions to access repository content

jobs:
  test_wsl:
    runs-on: windows-2022
    timeout-minutes: 90

    defaults:
      run:
        shell: wsl-bash {0}

    steps:
      # Checkout on the Windows side, then copy into the WSL virtual disk
      - name: Configure git to preserve LF line endings
        shell: cmd
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - name: Setup WSL2 with Ubuntu
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          update: 'true'
          additional-packages:
            build-essential
            gcc
            g++
            gfortran
            make
            automake
            autoconf
            libtool
            libx11-dev
            libpng-dev
            curl
            wget
            file
            git
            zip
            unzip
            python3
            python3-pip
            python3-venv
            apache2
            apache2-utils
            iproute2
            shellcheck

      - name: Copy sources to private WSL test directory
        run: |
          SRCDIR=$(wslpath '${{ github.workspace }}')
          useradd --create-home --shell /bin/bash unmwtest
          mkdir /tmp/unmw-ci
          cp -rp "$SRCDIR" /tmp/unmw-ci/source
          chown -R unmwtest:unmwtest /tmp/unmw-ci

      - name: Display Python version
        run: |
          python3 --version
          which python3

      - name: Install Python dependencies
        run: |
          cd /tmp/unmw-ci/source
          runuser -u unmwtest -- python3 -m venv /tmp/unmw-ci/venv
          runuser -u unmwtest -- /tmp/unmw-ci/venv/bin/python -m pip install -r requirements.txt -r requirements-test.txt rarfile
          runuser -u unmwtest -- bash tests/install_rar.sh /tmp/unmw-ci/rar-tools

      - name: Lint all sources
        run: |
          cd /tmp/unmw-ci/source
          /tmp/unmw-ci/venv/bin/python -m flake8 --select=E9,F63,F7,F82 --filename='*.py,*.py3' --exclude=.git,.venv,uploads .
          shellcheck --severity=error ./*.sh tests/*.sh

      - name: Offline unit and Apache tests as an unprivileged user
        run: |
          cd /tmp/unmw-ci/source
          unshare --net -- bash tests/offline_namespace.sh unmwtest \
            /tmp/unmw-ci/venv/bin/python /tmp/unmw-ci/unit present /tmp/unmw-ci/rar-tools/rar

      - name: Run self-test script
        run: |
          cd /tmp/unmw-ci/source
          runuser -u unmwtest -- env PATH="/tmp/unmw-ci/venv/bin:/tmp/unmw-ci/rar-tools/rar:/usr/local/bin:/usr/bin:/bin" \
            /tmp/unmw-ci/venv/bin/python tests/run_science_test.py /tmp/unmw-ci/science
        timeout-minutes: 65

      - name: Copy test artifacts to Windows filesystem
        if: always()
        run: |
          OUTDIR=$(wslpath '${{ github.workspace }}')
          mkdir -p "$OUTDIR/test_artifacts"
          python3 /tmp/unmw-ci/source/tests/collect_artifacts.py /tmp/unmw-ci "$OUTDIR/test_artifacts"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts-wsl
          path: test_artifacts/
          retention-days: 7
